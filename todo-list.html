<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Styled To-Do List</title>
    <link href="stylee.css" rel="stylesheet" />
</head>

<body>
    <div class="list">
    <h1>My To-Do List</h1>
<ul class="todo-list">
    <li> <input type="checkbox" 
    id ="gaming">
    <label for="gaming">Explore gaming keyboards</label>
    <ul class="sub-item">
     <li><a href="/" target="_blank" class="sub-item-link">Store Link</a></li>
     </ul>
    </li>
    <li ><input type="checkbox" 
    id ="report">
    <label for="report">Finish the report</label>
    <ul class="sub-item">
     <li><a href="/" target="_blank" class="sub-item-link">Request Access</a></li>
     </ul></li>
    <li><input type="checkbox" 
    id ="warranty">
    <label for="warranty">View Phone's Warranty</label>
    <ul class="sub-item">
     <li><a href="/" target="_blank" class="sub-item-link">View Receipts</a></li>
     </ul></li>
    <li><input type="checkbox" 
    id ="processor-specs">
    <label for="processor-specs">Check Processor Specs</label>
    <ul class="sub-item">
     <li><a href="/" target="_blank" class="sub-item-link">View Model Number</a></li>
     </ul></li>
    </ul>
    </div>
</body>

</html>
